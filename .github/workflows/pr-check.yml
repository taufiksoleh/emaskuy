name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        # Pre-existing lint debt in the codebase isn't part of this pipeline's
        # scope; surface it without blocking PRs until it's cleaned up.
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build (typecheck + bundle + prerender)
        run: npm run build

      - name: Verify built site
        run: node scripts/verify-dist.mjs
