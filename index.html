<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0e" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://api.gold-api.com" crossorigin />
    <link rel="preconnect" href="https://api.frankfurter.dev" crossorigin />
    <!--seo-->
    <title>Harga Emas Hari Ini: Live per Gram, Antam & Grafik | EmasKuy</title>
    <meta name="description" content="Harga emas live per gram dalam Rupiah dan USD/oz, harga Antam, grafik histori sejak 2013, alert harga, dan kalkulator investasi emas." />
    <meta property="og:title" content="Harga Emas Hari Ini: Live per Gram, Antam & Grafik | EmasKuy" />
    <meta property="og:description" content="Harga emas live per gram dalam Rupiah dan USD/oz, harga Antam, grafik histori sejak 2013, alert harga, dan kalkulator investasi emas." />
    <meta property="og:image" content="https://emaskuy.com/og-cover.png" />
    <meta property="og:type" content="website" />
    <!--/seo-->
    <style>
      /* The prerendered text is for crawlers without JavaScript. */
      html.js [data-prerender] {
        display: none;
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script>
      document.documentElement.classList.add('js');
      // Apply saved theme before first paint (no flash of wrong theme).
      try {
        var t = localStorage.getItem('emaskuy.theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
      if (document.documentElement.dataset.theme === 'light') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafaf7');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
